[package]
name = "wlcore"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "WatchLoader core: install apps on an Apple Watch from its paired iPhone"

[lib]
crate-type = ["staticlib"]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "tcp", "heartbeat", "companion_proxy"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "fs"] }
plist = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Several deps enable different rustls crypto backends; with more than one compiled in,
# rustls panics on first use unless a process-wide provider is installed explicitly.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Apple ID login, developer services (devices / App IDs / profiles / certificates) and
# code signing, from Impactor (plume_core is MPL-2.0, plume_utils/plume_store are MIT).
plume_core = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }
plume_utils = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }
plume_store = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }

# Impactor ships a patched apple-codesign; [patch] in a git dependency's own workspace is
# ignored, so apply it here.
[patch.crates-io]
apple-codesign = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"  # panics are caught in run() and reported instead of crashing
strip = "debuginfo"  # keep symbol names for crash reports
