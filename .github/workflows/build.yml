name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass APIs need the iOS 26 SDK (Xcode 26).
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Rust toolchain (iOS target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build Rust core
        working-directory: core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: cargo build --release --target aarch64-apple-ios

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project WatchLoader.xcodeproj -target WatchLoader \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -E "error:" build.log | sort -u | head -40 || true
          test -d build/Release-iphoneos/WatchLoader.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/WatchLoader.app Payload/
          zip -qr WatchLoader.ipa Payload
          ls -l WatchLoader.ipa
          echo "--- Info.plist sanity ---"
          for k in CFBundleIdentifier CFBundleExecutable UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            printf "%s = " "$k"; /usr/libexec/PlistBuddy -c "Print :$k" Payload/WatchLoader.app/Info.plist
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WatchLoader-ipa
          path: |
            WatchLoader.ipa
            build.log
