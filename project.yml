name: WatchLoader
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  WatchLoader:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_NAME: WatchLoader
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basimnassermu.watchloader
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/core/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lwlcore
        INFOPLIST_KEY_CFBundleDisplayName: WatchLoader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: WatchLoader talks to this iPhone and its paired Apple Watch to install watch apps.
