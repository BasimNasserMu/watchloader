name: WatchLoader
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  WatchLoader:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WatchLoader
        CFBundleShortVersionString: "0.3"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: WatchLoader talks to this iPhone and its paired Apple Watch to install watch apps.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: WatchLoader
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basimnassermu.watchloader
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/core/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lwlcore
